</div>

<div id="mainMenu" class="screen"><div class="tL">星焰猎手</div><div class="sT">湉优一家倾情制作</div><div id="walletBox">总金币 <b id="walletGold">0</b></div><button class="btn" id="btnNew">新 游 戏</button><button class="btn alt" id="btnContinue">继 续 游 戏</button><button class="btn gold" id="btnUpgrade">升 级</button><button class="btn alt" id="btnAchieve">成 就</button><button class="btn alt" id="btnInstr">说 明</button><button class="btn hide" id="btnOnline">联 机</button><button class="btn alt" id="btnExit">退 出 游 戏</button></div>
<div id="saveScreen" class="screen"><div class="tL" style="font-size:18px;">选择存档</div><div class="sT" id="saveSub">新游戏</div><div id="saveSlots"></div><button class="btn alt sm" id="btnSaveBack">返回</button></div>

"use strict";
/* ===== ANDROID TOUCH POLYFILL (必须最先) =====
   原理：所有可交互元素在 touchend 时主动合成 click，
   不依赖浏览器默认合成，彻底解决 Android 触屏无响应问题。 */
!(function(){
  var CLICKABLE="BUTTON,A,INPUT,SELECT,TEXTAREA,LABEL";
  var tsX=0,tsY=0,tsT=0,tsTarget=null;
  document.addEventListener("touchstart",function(e){
    if(e.touches.length!==1)return;
    var t=e.touches[0];
    tsX=t.clientX;tsY=t.clientY;tsT=Date.now();tsTarget=e.target;
  },{passive:true,capture:false});
  document.addEventListener("touchend",function(e){
    if(!tsTarget)return;
    var t=e.changedTouches[0];if(!t){tsTarget=null;return;}
    var dx=t.clientX-tsX,dy=t.clientY-tsY,dt=Date.now()-tsT;
    if(Math.abs(dx)<12&&Math.abs(dy)<12&&dt<600){
      var el=tsTarget;
      // 向上冒泡找到最近的可点击元素
      while(el&&el!==document.body){
        var tag=el.tagName;
        var isClickable=el.matches&&el.matches(CLICKABLE);
        var cls=el.classList||[];
        var hasPtr=cls.contains("btn")||cls.contains("fab")||cls.contains("cC")||cls.contains("saveSlot")||cls.contains("pC")||cls.contains("pln")||cls.contains("sI")||cls.contains("uB")||cls.contains("aR")||cls.contains("togBtn")||cls.contains("aBtn")||cls.contains("hkB")||el.id==="dashBtn"||el.id==="fabPause"||el.id==="fabSet";
        var hasPtrEv=el.onclick||(el.getAttribute&&el.getAttribute("role")==="button");
        var cs=window.getComputedStyle?window.getComputedStyle(el):null;
        var isPointer=cs&&(cs.cursor==="pointer"||cs.pointerEvents==="auto");
        if(isClickable||hasPtr||hasPtrEv||isPointer){
          // 不重复触发：300ms 内若已有原生 click 则跳过
          if(!el._tapFired||Date.now()-el._tapFired>350){
            el._tapFired=Date.now();
            e.preventDefault();
            var ev=new MouseEvent("click",{bubbles:true,cancelable:true,view:window});
            el.dispatchEvent(ev);
          }
          break;
        }
        el=el.parentElement;
      }
    }
    tsTarget=null;
  },{passive:false,capture:true});
  // 防止 300ms 延迟 + 双指缩放
  document.addEventListener("gesturestart",function(e){e.preventDefault();},{passive:false});
})();

function calcAchProg(){
  if(!SD)return[];
  var s=SD;
  /* combine current-run stats for "in progress" feeling */
  var tk=(s.tK||0)+kills,bk=(s.bK||0)+(boss?0:0),cl=s.cl||0;
  var mclen=(s.mC?s.mC.length:0)+0;

  var tr=(s.tR||0)+1;
  var td=(s.tD||0);
  var chst=(s.chst||0)+chests.length;
  var hexp=(s.hexP||0);
  var mxlv=Math.max(s.mxLv||0,lv);
  var nhb=(s.nHB||0);
  var hcl=(s.hCl||0),ncl=(s.nCl||0);
  var nHB=nhb;
  var uplen=(s.uP?s.uP.length:0);
  var noDmg=(s.noDmg||0)+(dmgT===0?1:0);
  var spdCl=(s.spdCl||0)+(GT<180?1:0);

  var gulvl=0;for(var k in s.gU)gulvl+=s.gU[k]||0;
  var progList=[];
  function addProg(nm,ic,desc,cur,tgt){
    if(s.ach&&s.ach.indexOf(nm)>=0)return;
    if(tgt<=0)return;
    var p=Math.min(1,cur/tgt);
    if(p<0.05)return; /* ignore <5% progress */
    progList.push({ic:ic,nm:ACH.find(function(a){return a.id===nm;}).nm,desc:desc,pct:Math.round(p*100),p:p});
  }
  /* Kills */
  var kTargets=[[1,"k1","⚔","击杀1敌人"],[10,"k10","⚔","击杀10敌人"],[50,"k50","💀","击杀50敌人"],[100,"k100","💀","击杀100敌人"],[500,"k500","☠","击杀500敌人"],[1000,"k1000","☠","击杀1000敌人"],[5000,"k5000","🗡","击杀5000敌人"]];
  for(var i=0;i<kTargets.length;i++){var kt=kTargets[i];addProg(kt[1],kt[2],kt[3],tk,kt[0]);}
  /* Boss kills */
  var bkTgts=[[1,"bk1","👑","击杀Boss"],[5,"bk5","👑","击杀5Boss"],[10,"bk10","🏆","击杀10Boss"],[25,"bk25","🏆","击杀25Boss"]];
  for(var i=0;i<bkTgts.length;i++){var bt=bkTgts[i];addProg(bt[1],bt[2],bt[3],bk,bt[0]);}
  /* Clears */
  addProg("c1","🌟","初次通关",cl,1);
  addProg("c3","🌟","通关3星域",mclen,3);
  addProg("c5","🌠","通关5星域",mclen,5);
  addProg("ch","💎","通关暗域",(s.mC&&s.mC.indexOf("hidden")>=0)?1:0,1);
  /* Grade */
  if((s.bG||"C")!=="S")addProg("sr","🔥","获得S级评价",(s.bG==="S"?1:0),1);
  /* Combo */
  addProg("c50","⚡","50连击",mcb,50);addProg("c100","🌩","100连击",mcb,100);
  /* No-hit boss */
  var nhCur=nhb+(dmgT===0?1:0);addProg("nh","✨","无伤击杀Boss",nhCur,1);addProg("nh5","✨","无伤击杀5Boss",nhb,5);
  /* Planes */
  addProg("ap","✈","解锁全部8架战机",uplen,8);
  /* Evolutions */
  addProg("e1","🧬","进化1个技能",evo,1);addProg("e3","🧬","进化3个技能",evo,3);addProg("e5","🧪","进化5个技能",evo,5);addProg("ev8","🧪","进化8个技能",evo,8);
  /* Difficulty */
  addProg("hc","💪","困难通关",hcl,1);addProg("nc","😱","噩梦通关",ncl,1);addProg("hnc","🌋","噩梦通关全图",ncl,5);
  /* Gold */
  var gTgts=[[100,"g100","💰","累计100金币"],[500,"g500","💰","累计500金币"],[2000,"g2000","💰","累计2000金币"],[5000,"g5000","🏦","累计5000金币"]];
  for(var i=0;i<gTgts.length;i++){var gt=gTgts[i];addProg(gt[1],gt[2],gt[3],tg,gt[0]);}
  /* Runs */
  var pTgts=[[5,"p5","🎖","进行5局"],[10,"p10","🎖","进行10局"],[25,"p25","🎖","进行25局"],[50,"p50","🎖","进行50局"],[100,"p100","👑","进行100局"]];
  for(var i=0;i<pTgts.length;i++){var pt=pTgts[i];addProg(pt[1],pt[2],pt[3],tr,pt[0]);}
  /* Totems */
  addProg("td10","🗿","摧毁10图腾",td,10);addProg("td50","🗿","摧毁50图腾",td,50);addProg("td100","🗿","摧毁100图腾",td,100);
  /* Chests */
  addProg("ch1","📦","拾取5宝箱",chst,5);addProg("ch2","📦","拾取20宝箱",chst,20);
  /* Hexagons */
  addProg("hex1","⬡","拾取六边形",hexp,1);addProg("hex2","⬡","拾取10六边形",hexp,10);
  /* Levels */
  addProg("lv20","📈","单局达20级",mxlv,20);addProg("lv30","📈","单局达30级",mxlv,30);
  /* No damage */
  /* No damage / speed clear: only show if actually achieved (since they require clear) */
  if(noDmg>0)addProg("dm0","🛡","单局0受伤通关",noDmg,1);
  if(spdCl>0)addProg("spd1","⚡","3分钟内通关",spdCl,1);
  /* All global upgrades maxed (20 * 5 = 100 levels) */
  addProg("ulAll","🌟","全局升级全满级",gulvl,100);
  /* Sort by progress desc, take top 3 */
  progList.sort(function(a,b){return b.p-a.p;});
  return progList.slice(0,3);
}

document.getElementById("dlgYes").addEventListener("click",function(){hideScr();if(dlgCb)dlgCb();dlgCb=null;dlgBack="mainMenu";});
document.getElementById("dlgNo").addEventListener("click",function(){dlgCb=null;if(dlgBack==="pauseOvl"){paused=true;showScr("pauseOvl");}else if(dlgBack==="settingsScreen"){showScr("settingsScreen");}else if(dlgBack==="upgradeMenu"){showUpMenu();}else if(dlgBack==="saveScreen"){showSave(saveMode);}else{ST="mainMenu";showScr("mainMenu");renderMM();}});
/* Plane */
function showPlSel(){renderPG();showScr("planeSelect");}
function renderPG(){var grid=document.getElementById("planeGrid");grid.innerHTML="";var unlocked=SD?SD.uP:["assault","sniper"];
  document.getElementById("planeSub").textContent=unlocked.length+"架可用 · "+(8-unlocked.length)+"架隐藏";
  for(var i=0;i<PL.length;i++){var p=PL[i],ul=unlocked.indexOf(p.id)>=0;
    var card=document.createElement("div");card.className="pC"+(ul?"":" locked")+(selPl===p.id?" sel":"");
    card.innerHTML='<div class="pI">'+p.ic+'</div><div class="pN">'+p.nm+'</div><div class="pD">'+p.ds+'</div>'+(ul?'':'<div class="pL">'+p.ud+'</div>');
    if(ul){(function(pid){card.addEventListener("click",function(){selPl=pid;renderPG();});})(p.id);}grid.appendChild(card);}}
/* Map */
function showMpSel(){renderMP();showScr("mapSelect");updDiff();}
function renderMP(){var area=document.getElementById("mapPA"),old=area.querySelectorAll(".pln");for(var i=0;i<old.length;i++)old[i].remove();
  var maps=[{id:"jin",nm:"金域",c:"#ffdd66",bg:"rgba(255,220,80,.2)",bd:"rgba(255,220,80,.5)"},{id:"mu",nm:"木域",c:"#66ff88",bg:"rgba(80,255,130,.2)",bd:"rgba(80,255,130,.5)"},{id:"shui",nm:"水域",c:"#66bbff",bg:"rgba(80,180,255,.2)",bd:"rgba(80,180,255,.5)"},{id:"huo",nm:"火域",c:"#ff7755",bg:"rgba(255,110,80,.2)",bd:"rgba(255,110,80,.5)"},{id:"tu",nm:"土域",c:"#ddbb77",bg:"rgba(200,160,100,.2)",bd:"rgba(200,160,100,.5)"}];
  var pcx=150,pcy=150,oR=110;
  for(var i=0;i<maps.length;i++){var m=maps[i],ang=-Math.PI/2+i*Math.PI*2/5,px=pcx+Math.cos(ang)*oR-29,py=pcy+Math.sin(ang)*oR-29;
    var pl=document.createElement("div");pl.className="pln"+(selMp===m.id?" sel":"");pl.style.cssText="left:"+px+"px;top:"+py+"px;background:"+m.bg+";border:2px solid "+m.bd+";color:"+m.c+";";
    var cl2=SD&&SD.mC&&SD.mC.indexOf(m.id)>=0;pl.innerHTML='<div class="pE">'+EN[m.id]+'</div>'+m.nm+(cl2?'<div class="cB" style="background:#2a4;color:#fff;">✓已通关</div>':'');
    (function(mid){pl.addEventListener("click",function(){selMp=mid;document.getElementById("mapDesc").textContent=EN[mid]+"域 - "+bNm(mid);renderMP();updDiff();});})(m.id);area.appendChild(pl);}
  if(SD&&SD.mC&&SD.mC.indexOf("hidden")>=0){var hp=document.createElement("div");hp.className="pln"+(selMp==="hidden"?" sel":"");
    hp.style.cssText="left:"+(pcx-29)+"px;top:"+(pcy-29)+"px;background:rgba(160,60,200,.2);border:2px solid rgba(160,60,200,.5);color:#b8f;width:58px;height:58px;";
    hp.innerHTML='<div class="pE">暗</div>隐藏<div class="cB" style="background:#2a4;color:#fff;">✓</div>';
    hp.addEventListener("click",function(){selMp="hidden";document.getElementById("mapDesc").textContent="暗域 - 终极挑战";renderMP();updDiff();});area.appendChild(hp);}}
function updDiff(){var ds=document.getElementById("diffSel"),cleared=SD&&SD.mC&&SD.mC.indexOf(selMp)>=0;
  ds.style.display=cleared?"block":"none";document.getElementById("hardCheck").checked=curDf==="hard";document.getElementById("nightCheck").checked=curDf==="nightmare";}
/* Upgrade menu */
function showUpMenu(){if(!SD){for(var i=0;i<3;i++){if(saves[i]){SD=JSON.parse(JSON.stringify(saves[i]));curSv=i;break;}}if(!SD)SD=defS();}renderUL();showScr("upgradeMenu");}
function renderUL(){var list=document.getElementById("upList");list.innerHTML="";var g2=SD.gold||0;document.getElementById("walletGold2").textContent=g2;
  var totalUps=0;for(var k in SD.gU)totalUps+=(SD.gU[k]||0);
  for(var id in GUP){var u=GUP[id],l=(SD.gU&&SD.gU[id])||0;
    var unlocked=u.ul||(SD.ach&&SD.ach.indexOf(u.ach)>=0);
    var cost=Math.ceil(u.bc*Math.pow(u.gr,l+totalUps*0.05));
    var row=document.createElement("div");row.className="uR"+(unlocked?"":" locked");
    if(unlocked){row.innerHTML='<div class="sInfo"><div class="uN">'+u.nm+' <span style="color:#fa0;font-size:10px;">Lv.'+l+'</span></div><div class="uDs">'+u.ds+'</div></div><button class="uB"'+(g2<cost?" disabled":"")+'>'+cost+'G</button>';
      (function(uid,uc){var btn=row.querySelector(".uB");if(btn)btn.addEventListener("click",function(){if((SD.gold||0)>=uc){SD.gold-=uc;if(!SD.gU)SD.gU={};SD.gU[uid]=(SD.gU[uid]||0)+1;SD.upCnt=(SD.upCnt||0)+1;svCur();renderUL();renderMM();}});})(id,cost);}
    else{var achNm=ACH.find(function(a){return a.id===u.ach;});row.innerHTML='<div class="sInfo"><div class="uN">??? <span class="uLk">[成就解锁: '+(achNm?achNm.nm:u.ach)+']</span></div><div class="uDs">'+u.ds+'</div></div>';}
    list.appendChild(row);}}
/* Reset global upgrades */
document.getElementById("btnUpReset").addEventListener("click",function(){
  pendIdx=-1;document.getElementById("dlgTitle").textContent="重置全局升级？";
  document.getElementById("dlgDesc").textContent="所有属性清零，返还100%金币。确认？";
  dlgCb=function(){var totalUps=0;for(var k in SD.gU)totalUps+=(SD.gU[k]||0);
    var refund=0;for(var k in SD.gU){var l=SD.gU[k]||0;var u=GUP[k];if(!u)continue;for(var j=0;j<l;j++){refund+=Math.ceil(u.bc*Math.pow(u.gr,j+totalUps*0.05));}}
    SD.gU={};SD.gold+=Math.floor(refund);SD.upCnt=0;saveCur();toast("重置!返还"+Math.floor(refund)+"G");renderUL();renderMM();showScr("upgradeMenu");};dlgBack="upgradeMenu";showScr("confirmDlg");});
/* Achievements */
function showAchScr(){if(!SD){for(var i=0;i<3;i++){if(saves[i]){SD=JSON.parse(JSON.stringify(saves[i]));curSv=i;break;}}if(!SD)SD=defS();}renderAL();showScr("achieveScreen");}
function renderAL(){var list=document.getElementById("achList");list.innerHTML="";var sd=SD||saves[0]||saves[1]||saves[2]||defS();
  var doneCount=0;
  for(var i=0;i<ACH.length;i++){var a=ACH[i],done=sd.ach&&sd.ach.indexOf(a.id)>=0,claimed=sd.clm&&sd.clm.indexOf(a.id)>=0;
    if(done)doneCount++;
    var row=document.createElement("div");row.className="aR"+(done?" done":"")+(claimed?" claimed":"");
    var btnHtml="";if(done&&!claimed&&sd===SD){btnHtml='<button class="aBtn" data-aid="'+a.id+'">领取</button>';}else if(claimed){btnHtml='<span style="font-size:9px;color:#4a8;">已领取</span>';}
    row.innerHTML='<div class="aI">'+(done?a.ic:"🔒")+'</div><div class="aInfo"><div class="aN">'+a.nm+'</div><div class="aD">'+a.ds+'</div></div>'+btnHtml;
    list.appendChild(row);}
  document.getElementById("achCnt").textContent=doneCount;
  /* Bind claim buttons */
  var btns=list.querySelectorAll(".aBtn");
  for(var j=0;j<btns.length;j++){(function(btn){btn.addEventListener("click",function(){
    var aid=btn.getAttribute("data-aid");var ach=ACH.find(function(a){return a.id===aid;});
    if(!ach||!ach.rw||!SD)return;
    if(!SD.clm)SD.clm=[];SD.clm.push(aid);
    var rewardTxt="";
    if(ach.rw.t==="gold"){SD.gold=(SD.gold||0)+ach.rw.v;rewardTxt="+"+ach.rw.v+" 金币";}
    else if(ach.rw.t==="gup"){var gu=GUP[ach.rw.v];rewardTxt="解锁全局升级:"+(gu?gu.nm:ach.rw.v);}
    else if(ach.rw.t==="plane"){var pid=ach.rw.v;if(SD.uP.indexOf(pid)<0)SD.uP.push(pid);var pl2=PL.find(function(p){return p.id===pid;});rewardTxt="解锁战机:"+(pl2?pl2.nm:pid);}
    document.getElementById("achPopTxt").innerHTML="成就 <b style=\'color:#f0c13a;\'>"+ach.ic+" "+ach.nm+"</b><br>获得奖励:<b style=\'color:#f0c13a;\'>"+rewardTxt+"</b>";
    showScr("achPop");saveCur();renderAL();renderMM();sfx.ch();});})(btns[j]);}}
/* Instructions with toggle */
function showInstr(){if(!SD){for(var i=0;i<3;i++){if(saves[i]){SD=JSON.parse(JSON.stringify(saves[i]));curSv=i;break;}}if(!SD)SD=defS();}renderInstr();showScr("instrScreen");}
function renderInstr(){var list=document.getElementById("instrList");list.innerHTML="";
  var sec1=document.createElement("div");sec1.className="instrSec";var h1=document.createElement("div");h1.className="iH";h1.textContent="主技能（专属·第一梯队）";sec1.appendChild(h1);
  var t1=["assaultBarrage","sniperShot","healPulse","reflectShield","shadowCloak","explosiveBomb","commanderAura","poisonSpray"];
  for(var i=0;i<t1.length;i++){var sk=MSK[t1[i]];if(!sk)continue;
    var plSk=getMPool().indexOf(t1[i])>=0;
    var dis=SD&&SD.disSk&&SD.disSk.indexOf(t1[i])>=0;
    var row=document.createElement("div");row.className="instrRow";
    if(plSk){row.innerHTML='<b>'+sk.nm+'</b> Lv'+sk.mx+'<br>'+sk.ds+'<br><span class="iEv">进化→'+sk.ev+' | 需: '+SSK[sk.en].nm+'</span><span class="togBtn'+(dis?"":" on")+'" data-sid="'+t1[i]+'">'+(dis?"禁用":"启用")+'</span>';}
    else{row.innerHTML='<b>'+sk.nm+'</b> Lv'+sk.mx+'<br>'+sk.ds+'<br><span class="iEv">进化→'+sk.ev+' | 需: '+SSK[sk.en].nm+'</span><span class="togBtn" style="background:#33240c;color:#c09030;border-color:#c09030;cursor:default;pointer-events:none;">未解锁</span>';}
    sec1.appendChild(row);}list.appendChild(sec1);
  var sec2=document.createElement("div");sec2.className="instrSec";var h2=document.createElement("div");h2.className="iH";h2.textContent="Boss技能（第二梯队）";sec2.appendChild(h2);
  var eS=["fireSkill","woodSkill","waterSkill","metalSkill","earthSkill"];
  for(var j=0;j<eS.length;j++){var sk2=MSK[eS[j]];if(!sk2)continue;
    var unlocked=SD&&SD.uES&&SD.uES.indexOf(eS[j])>=0;
    var dis2=SD&&SD.disSk&&SD.disSk.indexOf(eS[j])>=0;
    var row2=document.createElement("div");row2.className="instrRow";
    if(unlocked){row2.innerHTML='<b>'+sk2.nm+'</b><br>'+sk2.ds+'<br><span class="iEv">进化→'+sk2.ev+' | 需: '+SSK[sk2.en].nm+'</span><span class="togBtn'+(dis2?"":" on")+'" data-sid="'+eS[j]+'">'+(dis2?"禁用":"启用")+'</span>';}
    else{row2.innerHTML='<b>'+sk2.nm+'</b><br>'+sk2.ds+'<br><span class="iEv">进化→'+sk2.ev+' | 需: '+SSK[sk2.en].nm+'</span><span class="togBtn" style="background:#33240c;color:#c09030;border-color:#c09030;cursor:default;pointer-events:none;">未解锁</span>';}
    sec2.appendChild(row2);}list.appendChild(sec2);
  var sec3=document.createElement("div");sec3.className="instrSec";var h3=document.createElement("div");h3.className="iH";h3.textContent="副技能（20项）";sec3.appendChild(h3);
  for(var sid in SSK){var ss=SSK[sid];var dis3=SD&&SD.disSk&&SD.disSk.indexOf(sid)>=0;
    var row3=document.createElement("div");row3.className="instrRow";
    row3.innerHTML='<b>'+ss.nm+'</b> Lv'+ss.mx+'<br>'+ss.ds+' | '+ss.ef(0)+'<span class="togBtn'+(dis3?"":" on")+'" data-sid="'+sid+'">'+(dis3?"禁用":"启用")+'</span>';
    sec3.appendChild(row3);}list.appendChild(sec3);
  /* Bind toggle buttons */
  var tbs=list.querySelectorAll(".togBtn");
  for(var k=0;k<tbs.length;k++){(function(btn){btn.addEventListener("click",function(){
    var sid=btn.getAttribute("data-sid");if(!SD)return;if(!SD.disSk)SD.disSk=[];
    var idx=SD.disSk.indexOf(sid);if(idx>=0){SD.disSk.splice(idx,1);btn.classList.add("on");btn.textContent="启用";}
    else{SD.disSk.push(sid);btn.classList.remove("on");btn.textContent="禁用";}
    saveCur();});})(tbs[k]);}}
/* Settings */
function showSettings(){renderSet();showScr("settingsScreen");}
function renderSet(){var list=document.getElementById("setList");list.innerHTML="";
  var sets=[{id:"dur",nm:"单局时长",ds:"秒",min:120,max:600,step:30,val:GD,fmt:function(v){return v+"s";}},
    {id:"bossT",nm:"Boss时间",ds:"秒",min:120,max:540,step:30,val:BT,fmt:function(v){return v+"s";}},
    {id:"snd",nm:"音效",ds:"开/关",min:0,max:1,step:1,val:AC?1:0,fmt:function(v){return v?"开":"关";}}];
  for(var i=0;i<sets.length;i++){var s=sets[i];var row=document.createElement("div");row.className="setRow";
    row.innerHTML='<div class="sInfo"><div class="sNm">'+s.nm+'</div><div class="sDs">'+s.ds+'</div></div><input type="range" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+s.val+'"><span class="sVal">'+s.fmt(s.val)+'</span>';
    (function(sid,fmt){var inp=row.querySelector("input"),val=row.querySelector(".sVal");

var lastT=0;
function loop(now){requestAnimationFrame(loop);if(!lastT)lastT=now;var dt=(now-lastT)/1000;lastT=now;dt=Math.min(dt,.05);if(ST==="playing"&&!paused)update(dt);render();}
ldSv();resize();requestAnimationFrame(loop);
